<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Hábitos</title>
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes"></button>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-filter" aria-label="Filtrar por categoría"></button>
      <button class="icon-btn" id="btn-stats" aria-label="Estadísticas"></button>
      <button class="icon-btn primary" id="btn-add" aria-label="Nuevo hábito"></button>
    </div>
  </header>
  <nav class="chips" id="chips" hidden></nav>

  <main id="list"></main>

  <nav class="viewbar" aria-label="Vista">
    <button data-action="view" data-v="grid" data-icon="grid-3x3" aria-label="Cuadrícula"></button>
    <button data-action="view" data-v="list" data-icon="list-checks" aria-label="Últimos 5 días"></button>
    <button data-action="view" data-v="compact" data-icon="layout-list" aria-label="Compacta"></button>
  </nav>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" hidden></div>

  <script src="icons.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
